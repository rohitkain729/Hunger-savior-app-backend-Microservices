server:
  port: 6062

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    url: jdbc:mysql://localhost:3306/payments?createDatabaseIfNotExist=true
    password: admin
  application:
    name: payment-service
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    properties:
      hibernate:
        format_sql: 'true'
    hibernate:
      ddl-auto: update

